<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Connecting GitHub · Intelligent AI</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090d1a;color:#e8edff;font:16px system-ui,sans-serif}
main{max-width:32rem;margin:1.5rem;padding:2rem;border:1px solid #293653;border-radius:1.2rem;background:#121b30}
p{color:#aab6d2;line-height:1.6}
</style>
</head>
<body><main><h2>Finishing secure GitHub connection…</h2><p id="status">Saving the encrypted session on this device. Please keep this page open.</p></main>
<script>
(function(){
"use strict";
var KEY="ia_github_encrypted_session";
var params=new URLSearchParams(location.hash.slice(1));
var ticket=params.get("github_session");
var status=document.getElementById("status");
try{
 if(!ticket) throw new Error("The secure session was not returned by GitHub.");
 localStorage.setItem(KEY,ticket);
 if(localStorage.getItem(KEY)!==ticket) throw new Error("Browser storage did not retain the session.");
 history.replaceState({},document.title,location.pathname);
 status.textContent="Secure session saved. Returning to Intelligent AI…";
 setTimeout(function(){location.replace("./?github_connected=1");},350);
}catch(error){
 status.textContent=error.message+" Return to Settings and retry Connect GitHub securely.";
}
})();
</script></body></html>
