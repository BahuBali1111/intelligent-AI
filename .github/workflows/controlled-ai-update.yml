name: Controlled AI update proposal

on:
  workflow_dispatch:
    inputs:
      candidate_branch:
        description: "Existing proposal branch (must start with ai-proposal/)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-candidate:
    name: Validate proposed changes (no write secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate branch name
        env:
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          set -euo pipefail
          if [[ "$CANDIDATE_BRANCH" != ai-proposal/* ]]; then
            echo "Candidate branch must start with ai-proposal/"
            exit 1
          fi
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_branch }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run syntax checks
        run: |
          set -euo pipefail
          for file in app.js core.js memory.js knowledge.js update-engine.js research-desk.js research-analyzer.js code-workbench.js research-engine.js context-engine.js assistant-brain.js; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
      - name: Run existing tests
        run: |
          set -euo pipefail
          if [ -d tests ]; then
            mapfile -t test_files < <(find tests -maxdepth 1 -type f -name '*.test.js' | sort)
            if [ "${#test_files[@]}" -gt 0 ]; then node --test "${test_files[@]}"; fi
          fi
      - name: Validate manifest
        run: |
          if [ -f manifest.json ]; then node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"; fi

  open-review:
    name: Open pull request for owner review
    needs: validate-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create pull request (never merge automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ inputs.candidate_branch }}
        run: |
          set -euo pipefail
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --head "$CANDIDATE_BRANCH" \
            --base main \
            --title "Review AI update: $CANDIDATE_BRANCH" \
            --body "Automated validation passed for this proposal. Please inspect the diff and test results. This workflow does not merge or deploy changes. Merge only after explicit owner review."
