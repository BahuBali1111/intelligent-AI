name: Verify Intelligent AI GitHub connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check saved GitHub token without exposing it
        env:
          GH_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::AI_GITHUB_TOKEN secret is missing."
            exit 1
          fi
          repo_json="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/BahuBali1111/intelligent-AI)"
          echo "$repo_json" | jq -e '.full_name == "BahuBali1111/intelligent-AI"' >/dev/null
          echo "Repository access: confirmed"
          echo "$repo_json" | jq -r '"Repository: " + .full_name'
          echo "$repo_json" | jq -r '"Token repository push permission: " + ((.permissions.push // false) | tostring)'
          can_push="$(echo "$repo_json" | jq -r '.permissions.push // false')"
          if [ "$can_push" != "true" ]; then
            echo "::error::Token can read the repository but does not have push permission."
            exit 1
          fi
          echo "GitHub connection verification: SUCCESS"
