name: Intelligent AI quality checks

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required application files
        run: |
          set -eu
          for file in index.html style.css app.js manifest.json service-worker.js icon.svg README.md docs/PROJECT-VISION.md docs/ARCHITECTURE.md docs/ROADMAP.md docs/SELF-UPDATE.md docs/AI-GATEWAY.md memory.js knowledge.js update-engine.js research-desk.js research-analyzer.js code-workbench.js research-engine.js context-engine.js assistant-brain.js model-adapter.js integrations.js tests/integrations.test.js tests/model-adapter.test.js tests/assistant-brain.test.js tests/context-engine.test.js tests/memory.test.js tests/knowledge.test.js tests/update-engine.test.js tests/research-desk.test.js tests/research-analyzer.test.js tests/code-workbench.test.js tests/research-engine.test.js; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
      - name: Validate JavaScript syntax
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run core syntax and tests
        run: |
          node --check app.js
          node --check core.js
          node --check memory.js
          node --check knowledge.js
          node --check update-engine.js
          node --check research-desk.js
          node --check research-analyzer.js
          node --check code-workbench.js
          node --check research-engine.js
          node --check context-engine.js
          node --check assistant-brain.js
          node --check model-adapter.js
          node --check integrations.js
          node --test tests/core.test.js tests/memory.test.js tests/knowledge.test.js tests/update-engine.test.js tests/research-desk.test.js tests/research-analyzer.test.js tests/code-workbench.test.js tests/research-engine.test.js tests/context-engine.test.js tests/assistant-brain.test.js tests/model-adapter.test.js tests/integrations.test.js
      - name: Validate JSON manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Check core page references
        run: |
          grep -Eq 'href="\./style\.css(\?[^\"]*)?"' index.html
          grep -Eq 'src="\./app\.js(\?[^\"]*)?"' index.html
          grep -q 'rel="manifest"' index.html
          grep -q 'serviceWorker.register' app.js
          grep -q 'memory.js' index.html
          grep -q 'knowledge.js' index.html
          grep -q 'update-engine.js' index.html
          grep -q 'research-desk.js' index.html
          grep -q 'research-analyzer.js' index.html
          grep -q 'code-workbench.js' index.html
          grep -q 'research-engine.js' index.html
          grep -q 'context-engine.js' index.html
          grep -q 'assistant-brain.js' index.html
          grep -q 'model-adapter.js' index.html
          grep -q 'integrations.js' index.html
          for file in core.js memory.js knowledge.js update-engine.js research-desk.js research-analyzer.js code-workbench.js research-engine.js context-engine.js assistant-brain.js model-adapter.js integrations.js; do test -s "$file"; done
